<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İSYANKAR BET - Slot Lobby</title>
  <style>
    :root {
      --gold: #ffd700;
      --gold-glow: #ffae00;
      --neon-purple: #9d4edd;
      --neon-glow: #c77dff;
      --dark-bg: #0a0518;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--dark-bg); color: #fff; overflow-x: hidden; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 30px; background: rgba(15, 5, 30, 0.95);
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 0 15px var(--neon-purple);
    }
    .logo { font-size: 24px; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
    .user-panel { display: flex; gap: 15px; align-items: center; }
    .balance-box { background: #1a0933; border: 1px solid var(--gold); padding: 8px 15px; border-radius: 20px; color: var(--gold); font-weight: bold; }
    .btn { background: linear-gradient(45deg, #7b2cbf, #9d4edd); border: none; padding: 10px 20px; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; text-shadow: 0 0 5px #000; box-shadow: 0 0 10px var(--neon-purple); }
    .btn-gold { background: linear-gradient(45deg, #ff9e00, #ffd700); color: #000; box-shadow: 0 0 10px var(--gold-glow); }
    
    .main-layout { display: flex; min-height: calc(100vh - 70px); }
    .sidebar { width: 240px; background: rgba(20, 10, 40, 0.8); padding: 20px; border-right: 1px solid var(--neon-purple); }
    .sidebar ul { list-style: none; }
    .sidebar li { padding: 12px; margin-bottom: 8px; border-radius: 5px; background: rgba(255,255,255,0.05); cursor: pointer; font-weight: 600; }
    .sidebar li:hover { background: var(--neon-purple); }

    .content { flex: 1; padding: 30px; background: radial-gradient(circle at center, #240046 0%, #0a0518 100%); }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .game-card { background: #15082c; border: 2px solid var(--neon-purple); border-radius: 10px; overflow: hidden; position: relative; transition: 0.3s; box-shadow: 0 0 10px rgba(157, 78, 221, 0.3); }
    .game-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow); }
    .game-thumb { width: 100%; height: 140px; background: #2c1254; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: var(--gold); }
    .game-info { padding: 15px; text-align: center; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    .modal-body { background: #120327; border: 2px solid var(--gold); padding: 25px; border-radius: 12px; width: 800px; max-width: 95%; text-align: center; box-shadow: 0 0 30px var(--neon-purple); position: relative; }
    .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; color: #fff; cursor: pointer; }
    
    canvas#slotEngine { background: #000; border: 3px solid var(--gold); border-radius: 8px; margin: 15px auto; display: block; }
    .controls { display: flex; justify-content: center; gap: 15px; align-items: center; margin-top: 15px; }
    .price-list { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    .price-card { background: #1e0b3a; border: 1px solid var(--gold); padding: 10px; border-radius: 6px; width: 30%; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">İSYANKAR BET</div>
    <div class="user-panel">
      <div class="balance-box">Bakiye: <span id="userBalance">1000</span> Jeton</div>
      <button class="btn btn-gold" onclick="openShop()">Jeton Al</button>
      <button class="btn" onclick="openAuth()">Giriş / Kayıt</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="sidebar">
      <ul>
        <li>Popüler Oyunlar</li>
        <li>Slot Oyunları</li>
        <li>Rulet & Kart</li>
      </ul>
    </div>
    <div class="content">
      <h2 style="color: var(--gold); text-shadow: 0 0 10px var(--gold-glow);">Popüler Slotlar</h2>
      <div class="games-grid">
        <div class="game-card" onclick="launchGame('Gates of Olympus')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #4a154b, #11052c);">GATES OF OLYMPUS</div>
          <div class="game-info">
            <button class="btn btn-gold">Oyna</button>
          </div>
        </div>
        <div class="game-card" onclick="launchGame('Sweet Bonanza')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #ff4d6d, #590d22);">SWEET BONANZA</div>
          <div class="game-info">
            <button class="btn btn-gold">Oyna</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="gameModal" class="modal">
    <div class="modal-body">
      <span class="close-modal" onclick="closeGame()">&times;</span>
      <h2 id="gameTitle" style="color: var(--gold);">Slot Engine</h2>
      <canvas id="slotEngine" width="600" height="350"></canvas>
      <div class="controls">
        <button class="btn" onclick="adjustBet(-10)">-10</button>
        <span style="font-weight: bold; color: var(--gold);">Bahis: <span id="currentBet">50</span></span>
        <button class="btn" onclick="adjustBet(10)">+10</button>
        <button class="btn btn-gold" style="padding: 12px 30px; font-size: 16px;" onclick="spinSlot()">SPIN</button>
      </div>
    </div>
  </div>

  <div id="shopModal" class="modal">
    <div class="modal-body">
      <span class="close-modal" onclick="closeShop()">&times;</span>
      <h2 style="color: var(--gold);">Uygun Jeton Paketleri</h2>
      <div class="price-list">
        <div class="price-card" onclick="addBalance(100)">
          <h3>100 Jeton</h3>
          <p style="color: var(--gold);">10 TL</p>
        </div>
        <div class="price-card" onclick="addBalance(1000)">
          <h3>1.000 Jeton</h3>
          <p style="color: var(--gold);">50 TL</p>
        </div>
        <div class="price-card" onclick="addBalance(10000)">
          <h3>10.000 Jeton</h3>
          <p style="color: var(--gold);">200 TL</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let balance = 1000;
    let bet = 50;
    let isSpinning = false;
    const canvas = document.getElementById('slotEngine');
    const ctx = canvas.getContext('2d');

    const symbols = ['👑', '⚡', '💎', '🍇', '🍉', '👑'];
    let grid = Array(5).fill(null).map(() => Array(3).fill('💎'));

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const colWidth = canvas.width / 5;
      const rowHeight = canvas.height / 3;

      for (let c = 0; c < 5; c++) {
        for (let r = 0; r < 3; r++) {
          ctx.strokeStyle = '#9d4edd';
          ctx.strokeRect(c * colWidth, r * rowHeight, colWidth, rowHeight);
          ctx.font = '40px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffd700';
          ctx.fillText(grid[c][r], c * colWidth + colWidth / 2, r * rowHeight + rowHeight / 2);
        }
      }
    }

    function launchGame(title) {
      document.getElementById('gameTitle').innerText = title;
      document.getElementById('gameModal').style.display = 'flex';
      drawGrid();
    }

    function closeGame() { document.getElementById('gameModal').style.display = 'none'; }
    function openShop() { document.getElementById('shopModal').style.display = 'flex'; }
    function closeShop() { document.getElementById('shopModal').style.display = 'none'; }

    function adjustBet(val) {
      if (bet + val >= 10 && bet + val <= balance) {
        bet += val;
        document.getElementById('currentBet').innerText = bet;
      }
    }

    function addBalance(val) {
      balance += val;
      document.getElementById('userBalance').innerText = balance;
      closeShop();
    }

    function spinSlot() {
      if (isSpinning || balance < bet) return;
      isSpinning = true;
      balance -= bet;
      document.getElementById('userBalance').innerText = balance;

      let spins = 0;
      const interval = setInterval(() => {
        grid = grid.map(col => col.map(() => symbols[Math.floor(Math.random() * symbols.length)]));
        drawGrid();
        spins++;
        if (spins > 15) {
          clearInterval(interval);
          isSpinning = false;
          checkWin();
        }
      }, 80);
    }

    function checkWin() {
      if (grid[0][1] === grid[1][1] && grid[1][1] === grid[2][1]) {
        const winAmount = bet * 5;
        balance += winAmount;
        document.getElementById('userBalance').innerText = balance;
        alert('Tebrikler! ' + winAmount + ' Jeton Kazandınız!');
      }
    }
  </script>
</body>
</html>
